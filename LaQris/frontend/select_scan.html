<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LaQris - Pindai Kode QRIS</title>
    <!-- Modern Geometric Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js/config.js"></script>
    <script src="js/jsqr.min.js"></script>
    <style>
        :root {
            --laqris-blue: #2563EB;
            --laqris-cyan: #0284C7;
            --laqris-lime: #D4F63D;
            --dark-900: #0B0F19;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0B0F19;
            color: #FFFFFF;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        /* Mobile Viewport Container */
        .scanner-frame {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            height: 100dvh;
            background: #000000;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        /* ── Camera Viewport ── */
        .camera-viewport {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2D251E 0%, #15100C 60%, #080605 100%);
            overflow: hidden;
            z-index: 1;
            cursor: pointer;
        }

        .camera-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* Ambient scan textures if camera is standby */
        .camera-ambient-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at center, rgba(60, 48, 38, 0.6) 0%, rgba(15, 12, 10, 0.95) 80%),
                repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 2px, transparent 2px, transparent 8px);
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Laser Scan Beam Animation */
        /* Laser Scan Beam Animation - LaQris Electric Cyan */
        .scan-laser-line {
            position: absolute;
            left: 0;
            right: 0;
            top: 25%;
            height: 3.5px;
            background: #00E5FF;
            box-shadow: 
                0 0 16px 5px rgba(0, 229, 255, 0.85),
                0 0 32px 10px rgba(37, 99, 235, 0.55);
            border-radius: 2px;
            pointer-events: none;
            z-index: 5;
            animation: laserScanMove 2.8s ease-in-out infinite alternate;
        }

        @keyframes laserScanMove {
            0% {
                top: 18%;
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
            100% {
                top: 68%;
                opacity: 0.7;
            }
        }

        /* Viewfinder Frame Overlay */
        .viewfinder-crosshair {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            pointer-events: none;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .viewfinder-crosshair::before,
        .viewfinder-crosshair::after {
            content: '';
            position: absolute;
            width: 32px;
            height: 32px;
            border-color: rgba(255, 255, 255, 0.35);
            pointer-events: none;
        }

        .viewfinder-crosshair::before {
            top: 0;
            left: 0;
            border-top: 3px solid #FFFFFF;
            border-left: 3px solid #FFFFFF;
            border-radius: 6px 0 0 0;
        }

        .viewfinder-crosshair::after {
            bottom: 0;
            right: 0;
            border-bottom: 3px solid #FFFFFF;
            border-right: 3px solid #FFFFFF;
            border-radius: 0 0 6px 0;
        }

        .corner-tr {
            position: absolute;
            top: 0;
            right: 0;
            width: 32px;
            height: 32px;
            border-top: 3px solid #FFFFFF;
            border-right: 3px solid #FFFFFF;
            border-radius: 0 6px 0 0;
        }

        .corner-bl {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 32px;
            height: 32px;
            border-bottom: 3px solid #FFFFFF;
            border-left: 3px solid #FFFFFF;
            border-radius: 0 0 0 6px;
        }

        /* Success / Detected State - LaQris Electric Cyan & Royal Blue */
        .viewfinder-crosshair.detected::before,
        .viewfinder-crosshair.detected::after,
        .viewfinder-crosshair.detected .corner-tr,
        .viewfinder-crosshair.detected .corner-bl {
            border-color: #00E5FF !important;
            filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.95)) drop-shadow(0 0 4px #2563EB);
            transition: border-color 0.2s ease, filter 0.2s ease;
        }

        .viewfinder-crosshair.detected {
            box-shadow: inset 0 0 35px rgba(0, 229, 255, 0.2);
            border-radius: 12px;
            animation: pulseDetected 0.5s ease-in-out infinite alternate;
        }

        @keyframes pulseDetected {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1.03); }
        }

        /* Futuristic Circular Spinning Radar / Target Lock (1 Detik Animasi) */
        .qr-radar-lock {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 12;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .qr-radar-lock.active {
            display: flex;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .radar-spinner-ring {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px dashed rgba(0, 229, 255, 0.75);
            animation: spinRadarRing 1.8s linear infinite;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.35);
        }

        @keyframes spinRadarRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .radar-progress-svg-wrap {
            position: relative;
            width: 105px;
            height: 105px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .radar-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .radar-bg-circle {
            fill: rgba(11, 15, 25, 0.82);
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 5;
        }

        .radar-bar-circle {
            fill: transparent;
            stroke: #00E5FF;
            stroke-width: 5.5;
            stroke-linecap: round;
            stroke-dasharray: 264;
            stroke-dashoffset: 264;
            filter: drop-shadow(0 0 8px #00E5FF);
            transition: stroke-dashoffset 1s cubic-bezier(0.1, 0.7, 0.2, 1);
        }

        .radar-center-icon {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulseRadarIcon 0.8s ease-in-out infinite;
        }

        @keyframes pulseRadarIcon {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px #00E5FF); }
        }

        .radar-lock-label {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(11, 15, 25, 0.88);
            backdrop-filter: blur(10px);
            padding: 7px 18px;
            border-radius: 20px;
            border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.55);
        }

        .radar-title {
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            color: #00E5FF;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
        }

        .radar-sub {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 2px;
        }

        .detected-badge {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(2, 132, 199, 0.95);
            color: #FFFFFF;
            font-size: 0.85rem;
            font-weight: 800;
            padding: 8px 18px;
            border-radius: 30px;
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.45);
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 10;
            white-space: nowrap;
            backdrop-filter: blur(8px);
            letter-spacing: 0.02em;
            pointer-events: none;
        }

        .scan-hint-text {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.78rem;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        /* ── Top Bar (Floating Header) ── */
        .scanner-topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 20px 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
            pointer-events: none;
        }

        .btn-back-camera {
            pointer-events: auto;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-back-camera:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.2);
        }

        .qris-supported-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            margin-right: 4px;
        }

        .qris-supported-logo {
            height: 22px;
            width: auto;
            display: block;
            filter: brightness(0) invert(1);
        }

        .qris-supported-label {
            font-size: 0.68rem;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .topbar-spacer {
            width: 42px;
            height: 42px;
        }

        /* ── Floating Viewfinder Controls (Flashlight & Gallery) ── */
        .viewfinder-tools {
            position: absolute;
            bottom: 215px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 25;
            pointer-events: none;
        }

        .round-tool-btn {
            pointer-events: auto;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .round-tool-btn:hover {
            transform: scale(1.06);
            background: rgba(37, 99, 235, 0.7);
        }

        .round-tool-btn:active {
            transform: scale(0.92);
        }

        .round-tool-btn.active-torch {
            background: #FACC15;
            color: #0F172A;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
        }

        /* ── Bottom Sheet Drawer ── */
        .scanner-bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.35);
        }

        /* Top Banner - LaQris Royal Electric Blue */
        .sheet-banner-lime {
            background: linear-gradient(135deg, #1E40AF 0%, #2563EB 100%);
            border-radius: 24px 24px 0 0;
            padding: 13px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: filter 0.15s ease;
            box-shadow: 0 -3px 14px rgba(37, 99, 235, 0.25);
        }

        .sheet-banner-lime:active {
            filter: brightness(0.92);
        }

        .banner-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .banner-flag-badge {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            color: #FFFFFF;
            flex-shrink: 0;
        }

        .banner-text {
            font-size: 0.78rem;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.25;
        }

        .banner-text b {
            font-weight: 900;
            letter-spacing: 0.02em;
            color: #93C5FD;
        }

        .banner-chevron {
            color: #FFFFFF;
            flex-shrink: 0;
            margin-left: 6px;
        }

        /* White Bottom Modes Area */
        .sheet-modes-body {
            background: #FFFFFF;
            padding: 20px 24px 34px 24px;
        }

        .modes-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        .mode-option-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .mode-squircle {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            border: 1.5px solid #E2E8F0;
            background: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }

        .mode-option-wrap:active .mode-squircle {
            transform: scale(0.94);
        }

        .mode-squircle.active {
            border-color: #2563EB;
            box-shadow: 0 4px 18px rgba(37, 99, 235, 0.2);
            background: #EFF6FF;
        }

        .badge-mode-baru {
            position: absolute;
            top: -9px;
            right: -9px;
            background: linear-gradient(135deg, #0284C7 0%, #2563EB 100%);
            color: #FFFFFF;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
        }

        .mode-label-text {
            font-size: 0.84rem;
            font-weight: 800;
            color: #64748B;
            margin-top: 8px;
            transition: color 0.2s ease;
            text-align: center;
        }

        .mode-option-wrap.active .mode-label-text {
            color: #2563EB;
            font-weight: 900;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 15, 25, 0.88);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .scanner-spinner {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid #2563EB;
            border-radius: 50%;
            animation: spinAnim 0.8s linear infinite;
        }

        @keyframes spinAnim {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <div class="scanner-frame">

        <!-- Hidden File Inputs -->
        <input type="file" id="fileInputCamera" class="d-none" accept="image/*" capture="environment" onchange="handleImageSelection(event)">
        <input type="file" id="fileInputGallery" class="d-none" accept="image/*" onchange="handleImageSelection(event)">
        <canvas id="captureCanvas" class="d-none"></canvas>

        <!-- 1. Floating Top Bar -->
        <div class="scanner-topbar">
            <button class="btn-back-camera" onclick="goBackFromScanner()" title="Kembali">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
            </button>

            <div class="qris-supported-group">
                <img src="assets/qris_white.svg" alt="QRIS" class="qris-supported-logo">
                <span class="qris-supported-label">SUPPORTED</span>
            </div>

            <div class="topbar-spacer"></div>
        </div>

        <!-- 2. Live Camera Viewfinder Viewport -->
        <div class="camera-viewport" id="cameraViewport" onclick="triggerSnapshotOrPicker()" title="Ketuk untuk mengambil foto / memindai">
            <video id="videoFeed" class="camera-video" autoplay playsinline muted></video>

            <!-- Ambient background fallback if webcam is starting or inactive -->
            <div class="camera-ambient-bg" id="cameraAmbientBg">
                <div class="scan-hint-text">Arahkan kamera ke kode QRIS</div>
            </div>

            <!-- Viewfinder Crosshairs -->
            <div class="viewfinder-crosshair" id="viewfinderCrosshair">
                <div class="corner-tr"></div>
                <div class="corner-bl"></div>
            </div>

            <!-- Futuristic Spinning Radar/Target Lock Ring (Active for 1s on detection) -->
            <div class="qr-radar-lock" id="qrRadarLock">
                <div class="radar-spinner-ring"></div>
                <div class="radar-progress-svg-wrap">
                    <svg class="radar-svg" viewBox="0 0 100 100">
                        <circle class="radar-bg-circle" cx="50" cy="50" r="42"></circle>
                        <circle class="radar-bar-circle" id="radarBarCircle" cx="50" cy="50" r="42"></circle>
                    </svg>
                    <div class="radar-center-icon">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#00E5FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            <polyline points="9 11 12 14 22 4"></polyline>
                        </svg>
                    </div>
                </div>
                <div class="radar-lock-label">
                    <span class="radar-title">QRIS TERKUNCI</span>
                    <span class="radar-sub">Memverifikasi AI LaQris...</span>
                </div>
            </div>

            <!-- Detected Success Badge -->
            <div class="detected-badge" id="detectedBadge">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span>QRIS Terdeteksi!</span>
            </div>

            <!-- Animated Glowing Laser Beam -->
            <div class="scan-laser-line" id="scanLaserLine"></div>
        </div>

        <!-- 3. Floating Viewfinder Controls (Torch & Gallery) -->
        <div class="viewfinder-tools">
            <!-- Torch / Senter Button -->
            <button class="round-tool-btn" id="btnTorch" onclick="toggleFlashlight(event)" title="Nyalakan Lampu Kilat">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                </svg>
            </button>

            <!-- Gallery Button -->
            <button class="round-tool-btn" onclick="openGalleryPicker(event)" title="Pilih dari Galeri">
                <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="3" ry="3" />
                    <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" />
                    <path d="M21 15l-5-5L5 21" />
                    <path d="M14 14l2-2 5 5" />
                </svg>
            </button>
        </div>

        <!-- 4. Bottom Sheet Drawer -->
        <div class="scanner-bottom-sheet">
            <!-- Banner: BARU - Scan QR juga bisa di negara-negara ini. -->
            <div class="sheet-banner-lime" onclick="showCrossBorderInfo()">
                <div class="banner-left">
                    <div class="banner-flag-badge">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    </div>
                    <div class="banner-text">
                        <b>BARU</b> &mdash; Scan QR juga bisa di negara-negara ini.
                    </div>
                </div>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="banner-chevron">
                    <path d="M9 5l7 7-7 7" />
                </svg>
            </div>

            <!-- Mode Selector: Kode QR & QRIS Tap -->
            <div class="sheet-modes-body">
                <div class="modes-container">
                    <!-- 1. Mode Kode QR -->
                    <div class="mode-option-wrap active" id="modeOptionQR" onclick="selectMode('qr')">
                        <div class="mode-squircle active" id="modeSquircleQR">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 8V5a1 1 0 0 1 1-1h3" />
                                <path d="M16 4h3a1 1 0 0 1 1 1v3" />
                                <path d="M20 16v3a1 1 0 0 1-1 1h-3" />
                                <path d="M8 20H5a1 1 0 0 1-1-1v-3" />
                                <rect x="8" y="8" width="8" height="8" rx="1.5" fill="#3B82F6" fill-opacity="0.25" stroke="#2563EB" stroke-width="2" />
                            </svg>
                        </div>
                        <span class="mode-label-text">Kode QR</span>
                    </div>

                    <!-- 2. Mode QRIS Tap -->
                    <div class="mode-option-wrap" id="modeOptionTap" onclick="selectMode('tap')">
                        <div class="mode-squircle" id="modeSquircleTap">
                            <div class="badge-mode-baru">Baru</div>
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 8V5a1 1 0 0 1 1-1h3" />
                                <path d="M16 4h3a1 1 0 0 1 1 1v3" />
                                <path d="M20 16v3a1 1 0 0 1-1 1h-3" />
                                <path d="M8 20H5a1 1 0 0 1-1-1v-3" />
                                <path d="M10 8.5a4.5 4.5 0 0 1 0 7" />
                                <path d="M13 6.5a8 8 0 0 1 0 11" />
                            </svg>
                        </div>
                        <span class="mode-label-text">QRIS Tap</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5. Loading Overlay (When image is processing) -->
        <div id="loadingOverlay" class="loading-overlay d-none">
            <div class="scanner-spinner"></div>
            <div class="fw-bold text-white mt-3" style="font-size: 1.05rem;">Mempersiapkan Gambar...</div>
            <div class="text-white-50 small mt-1">Membuka Verifikasi AI LaQris</div>
        </div>

    </div>

    <script>
        let currentStream = null;
        let isTorchOn = false;
        let videoTrack = null;
        let isScanningActive = false;
        let isScanLocked = false;
        let barcodeDetectorInstance = null;

        // Offscreen canvas for ultra-fast QR decoding
        const scanCanvas = document.createElement('canvas');
        const scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
        let lastScanTimestamp = 0;
        const SCAN_INTERVAL_MS = 130; // Check ~7-8 times per second (smooth UI, instant detection)

        window.addEventListener('DOMContentLoaded', () => {
            initCamera();
        });

        // Play crisp banking-style success chime via Web Audio API
        function playScanSuccessSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                // Pleasant two-tone high frequency ping
                osc.type = 'sine';
                osc.frequency.setValueAtTime(950, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) {
                // Ignore if audio policy prevents autoplay
            }
        }

        // Play futuristic target-acquired lock beep
        function playTargetLockSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(650, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1050, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.14);
            } catch (e) {}
        }

        // Initialize user media camera with resilient mobile fallbacks
        async function initCamera() {
            const videoEl = document.getElementById('videoFeed');
            const ambientEl = document.getElementById('cameraAmbientBg');

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                console.warn("navigator.mediaDevices.getUserMedia not available (non-HTTPS or blocked).");
                videoEl.style.display = 'none';
                ambientEl.style.display = 'flex';
                return;
            }

            const constraintOptions = [
                { video: { facingMode: { ideal: 'environment' } }, audio: false },
                { video: { facingMode: 'environment' }, audio: false },
                { video: true, audio: false }
            ];

            let stream = null;
            let lastErr = null;

            for (const constraint of constraintOptions) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraint);
                    if (stream) break;
                } catch (err) {
                    lastErr = err;
                    console.warn("Constraint attempt failed:", constraint, err);
                }
            }

            if (!stream) {
                console.error("Camera access failed completely:", lastErr);
                videoEl.style.display = 'none';
                ambientEl.style.display = 'flex';
                return;
            }

            currentStream = stream;
            videoEl.srcObject = stream;
            videoEl.setAttribute('playsinline', 'true');
            videoEl.setAttribute('webkit-playsinline', 'true');
            videoEl.setAttribute('autoplay', 'true');
            videoEl.setAttribute('muted', 'true');
            videoEl.muted = true;

            videoEl.style.display = 'block';
            ambientEl.style.display = 'none';

            try {
                await videoEl.play();
            } catch (e) {
                console.warn("Autoplay notice:", e);
            }

            // Continuous autofocus & torch tracking
            const tracks = stream.getVideoTracks();
            if (tracks && tracks.length > 0) {
                videoTrack = tracks[0];
                if (videoTrack.getCapabilities) {
                    const capabilities = videoTrack.getCapabilities();
                    if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
                        try {
                            await videoTrack.applyConstraints({
                                advanced: [{ focusMode: 'continuous' }]
                            });
                        } catch (e) {}
                    }
                }
            }

            startRealtimeScanner();
        }

        // Start automatic continuous real-time scanner loop
        function startRealtimeScanner() {
            if (isScanningActive) return;
            isScanningActive = true;
            isScanLocked = false;

            // Initialize native hardware-accelerated BarcodeDetector if available
            if ('BarcodeDetector' in window) {
                try {
                    barcodeDetectorInstance = new BarcodeDetector({ formats: ['qr_code'] });
                } catch (e) {
                    barcodeDetectorInstance = null;
                }
            }

            requestAnimationFrame(tickRealtimeScanner);
        }

        let consecutiveSharpFrames = 0;
        const REQUIRED_SHARP_FRAMES = 2; // Membutuhkan minimal 2 frame berturut-turut yang jernih & stabil
        const MIN_SHARPNESS_SCORE = 9.5;  // Ambang batas ketajaman (dibawah ini dianggap buram/goyang)

        // Mengukur tingkat ketajaman gambar (Laplacian edge gradient)
        function evaluateFrameSharpness(ctx, width, height) {
            const startX = Math.floor(width * 0.2);
            const startY = Math.floor(height * 0.2);
            const sampleW = Math.floor(width * 0.6);
            const sampleH = Math.floor(height * 0.6);

            const imgData = ctx.getImageData(startX, startY, sampleW, sampleH);
            const data = imgData.data;
            const len = data.length;

            let edgeSum = 0;
            let samples = 0;

            // Sample edge gradients untuk mendeteksi kontras & fokus tinggi
            for (let i = 0; i < len - (sampleW * 4 * 2); i += 16) {
                const currentLuma = (data[i] * 3 + data[i + 1] * 6 + data[i + 2]) / 10;
                const rightLuma = (data[i + 4] * 3 + data[i + 4 + 1] * 6 + data[i + 4 + 2]) / 10;
                const bottomLuma = (data[i + sampleW * 4] * 3 + data[i + sampleW * 4 + 1] * 6 + data[i + sampleW * 4 + 2]) / 10;

                const gradX = Math.abs(currentLuma - rightLuma);
                const gradY = Math.abs(currentLuma - bottomLuma);

                edgeSum += (gradX + gradY);
                samples++;
            }

            return samples > 0 ? (edgeSum / samples) : 0;
        }

        // Frame tick loop
        async function tickRealtimeScanner(timestamp) {
            if (!isScanningActive || isScanLocked) return;

            const videoEl = document.getElementById('videoFeed');
            if (videoEl && videoEl.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA && videoEl.videoWidth > 0) {
                if (!lastScanTimestamp || timestamp - lastScanTimestamp >= SCAN_INTERVAL_MS) {
                    lastScanTimestamp = timestamp;
                    await scanFrameForQR(videoEl);
                }
            }

            if (isScanningActive && !isScanLocked) {
                requestAnimationFrame(tickRealtimeScanner);
            }
        }

        // Detect QR from current video frame dengan validasi ketajaman & stabilitas
        async function scanFrameForQR(videoEl) {
            if (isScanLocked) return;

            let qrDetected = false;
            let detectedData = '';
            const vw = videoEl.videoWidth;
            const vh = videoEl.videoHeight;
            if (vw <= 0 || vh <= 0) return;

            // Siapkan offscreen canvas
            const scale = Math.min(1, 560 / vw);
            const targetW = Math.floor(vw * scale);
            const targetH = Math.floor(vh * scale);

            if (scanCanvas.width !== targetW || scanCanvas.height !== targetH) {
                scanCanvas.width = targetW;
                scanCanvas.height = targetH;
            }

            scanCtx.drawImage(videoEl, 0, 0, targetW, targetH);

            // 1. Coba Native BarcodeDetector
            if (barcodeDetectorInstance) {
                try {
                    const barcodes = await barcodeDetectorInstance.detect(videoEl);
                    if (barcodes && barcodes.length > 0) {
                        qrDetected = true;
                        detectedData = barcodes[0].rawValue || '';
                    }
                } catch (e) {}
            }

            // 2. Fallback ke jsQR engine
            if (!qrDetected && typeof jsQR === 'function') {
                const imgData = scanCtx.getImageData(0, 0, targetW, targetH);
                const code = jsQR(imgData.data, targetW, targetH, {
                    inversionAttempts: 'dontInvert'
                });

                if (code && code.data) {
                    qrDetected = true;
                    detectedData = code.data;
                }
            }

            const scanHint = document.querySelector('.scan-hint-text');

            if (qrDetected) {
                // UJI KUALITAS GAMBAR: Pastikan gambar tajam & fokus
                const sharpness = evaluateFrameSharpness(scanCtx, targetW, targetH);

                if (sharpness < MIN_SHARPNESS_SCORE) {
                    // Gambar masih blur / tangan goyang
                    consecutiveSharpFrames = 0;
                    if (scanHint) {
                        scanHint.textContent = "Fokuskan & Tahan Stabil...";
                        scanHint.style.background = "rgba(202, 138, 4, 0.5)";
                        scanHint.style.color = "#FEF08A";
                    }
                    return; // Tunggu sampai fokus jernih
                }

                consecutiveSharpFrames++;
                if (scanHint) {
                    scanHint.textContent = "Kualitas Bagus! Mengunci...";
                    scanHint.style.background = "rgba(16, 185, 129, 0.6)";
                    scanHint.style.color = "#FFFFFF";
                }

                // Butuh minimal 2 frame jernih berturut-turut agar foto sempurna
                if (consecutiveSharpFrames >= REQUIRED_SHARP_FRAMES) {
                    onQRCodeAutoDetected(videoEl, detectedData);
                }
            } else {
                consecutiveSharpFrames = 0;
                if (scanHint) {
                    scanHint.textContent = "Arahkan kamera ke kode QRIS";
                    scanHint.style.background = "rgba(0, 0, 0, 0.35)";
                    scanHint.style.color = "rgba(255, 255, 255, 0.75)";
                }
            }
        }

        // Handle successful automatic detection saat gambar sudah sangat jernih
        function onQRCodeAutoDetected(videoEl, qrData) {
            if (isScanLocked) return;
            isScanLocked = true;
            isScanningActive = false;

            // 1. Initial Target Lock Feedback (Sound & Vibration)
            if (navigator.vibrate) {
                try { navigator.vibrate(50); } catch (e) {}
            }
            playTargetLockSound();

            // 2. Visual: Viewfinder turns glowing electric blue & cyan
            const crosshair = document.getElementById('viewfinderCrosshair');
            if (crosshair) crosshair.classList.add('detected');

            const laser = document.getElementById('scanLaserLine');
            if (laser) laser.style.animationPlayState = 'paused';

            // 3. Tampilkan Animasi Memutar Keren (HUD Radar Ring)
            const radar = document.getElementById('qrRadarLock');
            if (radar) {
                radar.classList.add('active');
                // Mulai pengisian lingkaran progress selama tepat 1 detik
                setTimeout(() => {
                    const bar = document.getElementById('radarBarCircle');
                    if (bar) bar.style.strokeDashoffset = '0';
                }, 30);
            }

            // 4. Ambil foto snapshot resolusi tinggi tertinggi dari kamera (96% JPEG quality)
            const canvas = document.getElementById('captureCanvas');
            canvas.width = videoEl.videoWidth || 1280;
            canvas.height = videoEl.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.96);

            if (qrData) {
                sessionStorage.setItem('laqris_detected_qr_payload', qrData);
            }

            // 5. TUNGGU TEPAT 1 DETIK (1000ms) dengan animasi memutar keren!
            setTimeout(() => {
                // Bunyi sukses akhir & getar mantap
                playScanSuccessSound();
                if (navigator.vibrate) {
                    try { navigator.vibrate([70, 40, 70]); } catch (e) {}
                }

                showLoading();
                sessionStorage.setItem('laqris_pending_file', dataUrl);
                sessionStorage.setItem('laqris_pending_filename', 'auto_qris_hd_' + Date.now() + '.jpg');
                stopCameraStream();
                location.href = 'scan.html';
            }, 1000);
        }

        // Toggle flashlight / torch
        async function toggleFlashlight(event) {
            if (event) event.stopPropagation();
            const btnTorch = document.getElementById('btnTorch');

            if (videoTrack && videoTrack.getCapabilities) {
                const capabilities = videoTrack.getCapabilities();
                if (capabilities.torch) {
                    try {
                        isTorchOn = !isTorchOn;
                        await videoTrack.applyConstraints({
                            advanced: [{ torch: isTorchOn }]
                        });
                        btnTorch.classList.toggle('active-torch', isTorchOn);
                        return;
                    } catch (e) {
                        console.warn("Gagal menyalakan lampu kilat:", e);
                    }
                }
            }

            // Visual feedback toggle
            isTorchOn = !isTorchOn;
            btnTorch.classList.toggle('active-torch', isTorchOn);
            if (isTorchOn) {
                document.getElementById('cameraViewport').style.filter = 'brightness(1.25)';
            } else {
                document.getElementById('cameraViewport').style.filter = 'none';
            }
        }

        // Open Gallery Picker
        function openGalleryPicker(event) {
            if (event) event.stopPropagation();
            document.getElementById('fileInputGallery').click();
        }

        // Handle Image Selection from file inputs (Gallery / Camera fallback)
        function handleImageSelection(event) {
            const file = event.target.files[0];
            if (!file) return;

            showLoading();

            const reader = new FileReader();
            reader.onload = function (e) {
                sessionStorage.setItem('laqris_pending_file', e.target.result);
                sessionStorage.setItem('laqris_pending_filename', file.name || 'qris_image.jpg');
                stopCameraStream();
                location.href = 'scan.html';
            };
            reader.readAsDataURL(file);
        }

        // Trigger snapshot from video or open camera file picker (Manual tap)
        function triggerSnapshotOrPicker() {
            if (isScanLocked) return;
            const videoEl = document.getElementById('videoFeed');

            if (currentStream && videoEl && videoEl.videoWidth > 0) {
                // Capture frame from video feed to canvas
                const canvas = document.getElementById('captureCanvas');
                canvas.width = videoEl.videoWidth;
                canvas.height = videoEl.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.94);
                showLoading();
                sessionStorage.setItem('laqris_pending_file', dataUrl);
                sessionStorage.setItem('laqris_pending_filename', 'kamera_laqris_' + Date.now() + '.jpg');
                stopCameraStream();
                location.href = 'scan.html';
            } else {
                // Fallback to camera file input
                document.getElementById('fileInputCamera').click();
            }
        }

        function stopCameraStream() {
            isScanningActive = false;
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
        }

        function showLoading() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (loadingOverlay) loadingOverlay.classList.remove('d-none');
        }

        // Mode selector
        function selectMode(mode) {
            const optQR = document.getElementById('modeOptionQR');
            const optTap = document.getElementById('modeOptionTap');
            const sqQR = document.getElementById('modeSquircleQR');
            const sqTap = document.getElementById('modeSquircleTap');

            if (mode === 'qr') {
                optQR.classList.add('active');
                sqQR.classList.add('active');
                optTap.classList.remove('active');
                sqTap.classList.remove('active');
            } else if (mode === 'tap') {
                optTap.classList.add('active');
                sqTap.classList.add('active');
                optQR.classList.remove('active');
                sqQR.classList.remove('active');
                alert("QRIS Tap (NFC): Dekatkan bagian belakang ponsel Anda ke mesin pembaca / EDC untuk transaksi nirsentuh.");
            }
        }

        function showCrossBorderInfo() {
            alert("QRIS Cross-Border: Anda kini dapat bertransaksi langsung menggunakan QRIS di Thailand, Malaysia, dan Singapura!");
        }

        // Navigasi Kembali Cerdas: kembali ke halaman asal (index.html atau dashboard.html)
        function goBackFromScanner() {
            stopCameraStream();
            const origin = sessionStorage.getItem('laqris_scan_origin');
            if (origin) {
                sessionStorage.removeItem('laqris_scan_origin');
                location.href = origin;
                return;
            }
            if (document.referrer && (document.referrer.includes('index.html') || document.referrer.includes('dashboard.html'))) {
                location.href = document.referrer;
                return;
            }
            if (window.history.length > 1) {
                window.history.back();
            } else {
                location.href = 'index.html';
            }
        }
    </script>
</body>

</html>
