<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LaQris - Masuk / Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1e293b;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .phone-frame {
            width: 100%;
            max-width: 100%;
            background: #ffffff;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .btn-back {
            width: 36px;
            height: 36px;
            background: #f1f5f9;
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            color: #475569;
            transition: all 0.2s ease;
        }

        .btn-back:hover { background: #e2e8f0; color: #0f172a; }

        .topbar-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #0f172a;
        }

        .phone-body {
            padding: 24px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .auth-header {
            margin-bottom: 28px;
        }

        .auth-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 0.85rem;
            color: #64748b;
            line-height: 1.5;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
            display: block;
        }

        .form-control-custom {
            width: 100%;
            padding: 12px 14px;
            font-size: 0.9rem;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            color: #0f172a;
            transition: all 0.2s;
            outline: none;
        }

        .form-control-custom:focus {
            background: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 14px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.25);
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(2, 132, 199, 0.35);
        }

        .auth-footer {
            margin-top: auto;
            padding-top: 24px;
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
        }

        .auth-footer a {
            color: #0284c7;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover { text-decoration: underline; }

        .alert-custom {
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.84rem;
            margin-bottom: 16px;
            display: none;
        }

        .alert-danger-custom {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
        }

        .alert-success-custom {
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>

<div class="phone-frame">

    <!-- Top bar -->
    <div class="topbar">
        <button class="btn-back" onclick="location.href='index.html'">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
            </svg>
        </button>
        <span class="topbar-title">Masuk ke LaQris</span>
    </div>

    <div class="phone-body">

        <div class="auth-header">
            <h1 class="auth-title">Selamat Datang Kembali</h1>
            <p class="auth-subtitle">Masuk dengan email dan password akun LaQris Anda.</p>
        </div>

        <!-- Alert Error/Success -->
        <div id="alertError" class="alert-custom alert-danger-custom"></div>
        <div id="alertSuccess" class="alert-custom alert-success-custom"></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="loginEmail" class="form-control-custom" placeholder="nama@email.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-control-custom" placeholder="Masukkan password Anda" required>
            </div>

            <button type="submit" id="btnLoginSubmit" class="btn-submit">
                Masuk Sekarang
            </button>
        </form>

        <div class="auth-footer">
            Belum punya akun? <a href="register.html">Register</a>
        </div>

    </div>

</div>

<script>
async function handleLogin(e) {
    e.preventDefault();
    const errBox = document.getElementById('alertError');
    const succBox = document.getElementById('alertSuccess');
    errBox.style.display = 'none';
    succBox.style.display = 'none';

    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    const btn = document.getElementById('btnLoginSubmit');
    btn.disabled = true;
    btn.textContent = 'Memverifikasi...';

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const data = await res.json();

        if (res.ok) {
            succBox.textContent = `👋 Selamat datang kembali, ${data.user?.full_name || 'Pengguna'}!`;
            succBox.style.display = 'block';
            localStorage.setItem('laqris_user', JSON.stringify(data.user));
            setTimeout(() => {
                location.href = 'index.html';
            }, 1000);
        } else {
            errBox.textContent = data.detail || 'Email atau password salah.';
            errBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Masuk Sekarang';
        }
    } catch (err) {
        errBox.textContent = 'Terjadi kesalahan jaringan: ' + err.message;
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Masuk Sekarang';
    }
}
</script>
</body>
</html>
