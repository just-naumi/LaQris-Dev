<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LaQris - Status Verifikasi QRIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1e293b;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .phone-frame {
            width: 100%;
            max-width: 100%;
            background: #ffffff;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ── Home Screen ──────────────────────────────────── */
        .home-screen {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .home-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
        }

        .home-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .home-brand-name {
            font-size: 1.15rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .home-auth-btns {
            display: flex;
            gap: 8px;
        }

        .btn-login {
            font-size: 0.82rem;
            font-weight: 600;
            color: #0284c7;
            background: transparent;
            border: 1.5px solid #bfdbfe;
            padding: 7px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background: #eff6ff;
            border-color: #0284c7;
        }

        .btn-register {
            font-size: 0.82rem;
            font-weight: 600;
            color: #ffffff;
            background: #0284c7;
            border: none;
            padding: 7px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-register:hover {
            background: #0369a1;
        }

        /* Hero section */
        .home-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 36px 20px 32px 20px;
            text-align: left;
        }

        .hero-title-brand {
            font-size: 2.75rem;
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin-bottom: 0;
        }

        .title-line-1 {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0A192F;
        }

        .title-line-2 {
            color: #0A192F;
        }

        .title-line-3,
        .title-line-4 {
            color: #2323ff;
        }

        .title-shield-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: #2563EB;
            border-radius: 50%;
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
        }

        .hero-accent-bar {
            width: 42px;
            height: 4px;
            background: #2563EB;
            border-radius: 2px;
            margin: 20px 0 18px 0;
        }

        .home-subtitle-left {
            font-size: 0.92rem;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 32px;
            max-width: 320px;
        }

        .home-subtitle-left strong {
            color: #0F172A;
            display: block;
            margin-top: 4px;
        }

        .btn-scan-main {
            background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 18px 32px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(2, 132, 199, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .btn-scan-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(2, 132, 199, 0.38);
        }

        .btn-scan-main:active {
            transform: scale(0.98);
        }

        .home-footer {
            padding: 16px 20px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="phone-frame">

        <div class="home-screen">

            <!-- Top bar: Brand + Login / Register -->
            <div class="home-topbar">
                <div class="home-brand">
                    <span class="home-brand-name">LaQris</span>
                </div>
                <div class="home-auth-btns" id="authNavBtns">
                    <button class="btn-login" onclick="location.href='login.html'">Login</button>
                    <button class="btn-register" onclick="location.href='register.html'">Register</button>
                </div>
            </div>

            <!-- Center Hero -->
            <div class="home-hero">
                <div
                    style="display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 16px;">
                    <div class="hero-title-brand">
                        <div class="title-line-1">
                            <span>Scan</span>
                            <div class="title-shield-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                                    <polyline points="9 11 12 14 22 4"></polyline>
                                </svg>
                            </div>
                        </div>
                        <div class="title-line-2">First.</div>
                        <div class="title-line-3">Pay</div>
                        <div class="title-line-4">Safe.</div>
                    </div>
                    <img src="images/hand.png" alt="Ilustrasi" style="width: 175px; max-width: 48%; height: auto; object-fit: contain; flex-shrink: 0; align-self: center;">
                </div>

                <div class="hero-accent-bar"></div>

                <p class="home-subtitle-left">
                    Always verify the merchant before scanning any QRIS.
                    <strong>Your safety is in your hands.</strong>
                </p>

                <!-- BIG Scan Button -->
                <button class="btn-scan-main" onclick="location.href='select_scan.html'">
                    <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z" />
                    </svg>
                    Scan QRIS
                </button>

            </div>

            <!-- Footer -->
            <div class="home-footer">
                QRIS Fraud Detection &amp; Merchant Reputation System
            </div>
        </div>

    </div>

</body>

</html>
