<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LaQris - Status Verifikasi QRIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1e293b;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .phone-frame {
            width: 100%;
            max-width: 100%;
            background: #ffffff;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ── Home Screen ──────────────────────────────────── */
        .home-screen {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .home-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
        }

        .home-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .home-brand-name {
            font-size: 1.15rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .home-auth-btns {
            display: flex;
            gap: 8px;
        }

        .btn-login {
            font-size: 0.82rem;
            font-weight: 600;
            color: #0284c7;
            background: transparent;
            border: 1.5px solid #bfdbfe;
            padding: 7px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background: #eff6ff;
            border-color: #0284c7;
        }

        .btn-register {
            font-size: 0.82rem;
            font-weight: 600;
            color: #ffffff;
            background: #0284c7;
            border: none;
            padding: 7px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-register:hover { background: #0369a1; }

        /* Hero section */
        .home-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            text-align: center;
        }

        .home-hero-icon {
            width: 88px;
            height: 88px;
            background: linear-gradient(135deg, #e0f2fe, #eff6ff);
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 28px rgba(2, 132, 199, 0.15);
        }

        .home-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .home-subtitle {
            font-size: 0.88rem;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 36px;
            max-width: 300px;
        }

        .btn-scan-main {
            background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 18px 32px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(2, 132, 199, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .btn-scan-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(2, 132, 199, 0.38);
        }

        .btn-scan-main:active { transform: scale(0.98); }

        .home-footer {
            padding: 16px 20px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="phone-frame">

    <div class="home-screen">

        <!-- Top bar: Brand + Login / Register -->
        <div class="home-topbar">
            <div class="home-brand">
                <span class="home-brand-name">LaQris</span>
            </div>
            <div class="home-auth-btns">
                <button class="btn-login">Login</button>
                <button class="btn-register">Register</button>
            </div>
        </div>

        <!-- Center Hero -->
        <div class="home-hero">
            <div class="home-hero-icon">
                <svg width="44" height="44" fill="none" viewBox="0 0 24 24" stroke="#0284c7" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 013.75 9.375v-4.5zM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 01-1.125-1.125v-4.5zM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0113.5 9.375v-4.5z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 6.75h.75v.75h-.75v-.75zM6.75 16.5h.75v.75h-.75v-.75zM16.5 6.75h.75v.75h-.75v-.75zM13.5 13.5h.75v.75h-.75v-.75zM13.5 19.5h.75v.75h-.75v-.75zM19.5 13.5h.75v.75h-.75v-.75zM19.5 19.5h.75v.75h-.75v-.75zM16.5 16.5h.75v.75h-.75v-.75z"/>
                </svg>
            </div>

            <h1 class="home-title">Cek Keaslian<br>Stiker QRIS</h1>
            <p class="home-subtitle">
                Verifikasi QRIS sebelum bayar. Deteksi stiker QRIS yang ditimpa atau dimanipulasi dengan AI.
            </p>

            <!-- BIG Scan Button -->
            <button class="btn-scan-main" onclick="location.href='scan.html'">
                <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"/>
                </svg>
                Scan Stiker QRIS
            </button>
        </div>

        <!-- Footer -->
        <div class="home-footer">
            LaQris &mdash; QRIS Fraud Detection &amp; Merchant Reputation System
        </div>
    </div>

</div>

</body>
</html>
